services:

  # ── Backend (Spring Boot) ──────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spotify_tracker_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST:              ${DB_HOST:-host.docker.internal}
      DB_PORT:              ${DB_PORT:-3307}
      DB_NAME:              ${DB_NAME:-usuarios_tfg}
      DB_USER:              ${DB_USER:-tfg_user}
      DB_PASSWORD:          ${DB_PASSWORD:-tfg_password}
      DB_TIMEZONE:          ${DB_TIMEZONE:-Europe/Madrid}
      FLYWAY_ENABLED:       ${FLYWAY_ENABLED:-false}
      SPOTIFY_CLIENT_ID:    ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/spotify}
      JWT_SECRET:           ${JWT_SECRET:-CHANGE_ME_DEV_ONLY}
      FRONTEND_URL:         ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}

  # ── Frontend (Vue + Nginx) ─────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_APP_TITLE: ${VITE_APP_TITLE:-Spotify Tracker}
    container_name: spotify_tracker_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
