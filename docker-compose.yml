services:

  # ── PostgreSQL ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: spotify_tracker_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB:       spotifytracker_db
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: 123456789
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spotifytracker_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Spring Boot) ──────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spotify_tracker_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST:              postgres
      DB_PORT:              5432
      DB_NAME:              spotifytracker_db
      DB_USER:              postgres
      DB_PASSWORD:          123456789
      SPOTIFY_CLIENT_ID:    ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/spotify}
      JWT_SECRET:           ${JWT_SECRET:-SpotifyTrackerSecretKeyMuyLargaCambiarEnProduccion}
      FRONTEND_URL:         ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy

  # ── Frontend (Vue + Nginx) ─────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_APP_TITLE: ${VITE_APP_TITLE:-Spotify Tracker}
    container_name: spotify_tracker_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
